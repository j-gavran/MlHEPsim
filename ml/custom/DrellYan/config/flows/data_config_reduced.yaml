data_config:
  data_name: DrellYan
  input_dim: 6
  base_distribution: normal
  train_split: 0.8
  val_split: 0.5

  input_processing:
    data_dir: ml/data/drellyan/
    base_file_name: DrellYan_data
    shuffle: True
    keep_ratio: 1.0
    hold_mode: True
    use_hold: True
    hold_ratio: 0.5
    # Mass region selection: 'full_data' or 'sidebands'
    mass_region: sidebands  
    # Signal region mass range
    min_mass: 110
    max_mass: 160
    # Sideband mass ranges (only used if mass_region: sidebands)
    sideband_lower_min: 110
    sideband_lower_max: 120
    sideband_upper_min: 130
    sideband_upper_max: 160

  feature_selection:
    n_data: null  #for testing use 100000 & null for all data during actual training #Warning don't use less than 100k for DrellYan as it will cause issues with batch_size 
    keep_names: ["Muons_Pos_Eta", "Muons_Neg_Eta","Muons_Pos_Phi", "Muons_Neg_Phi" , "Muons_Pos_PT", "Muons_Minv_MuMu"]


  preprocessing:
    cont_rescale_type: gauss_rank
    disc_rescale_type: null
    no_process: null

  dataloader_config:
    batch_size: 1024
    num_workers: 4  # Use -1 to use all available cores
    pin_memory: False
    drop_last: True
    persistent_workers: False  # Don't keep workers alive to save memory
